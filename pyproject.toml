[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-defect-inspection"
version = "1.0.0"
description = "Industrial surface defect detection & optical inspection system (OpenCV + scikit-learn)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24", "opencv-python-headless>=4.8", "scikit-learn>=1.3",
  "scikit-image>=0.21", "PyYAML>=6.0", "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
app = ["streamlit>=1.30"]

[project.scripts]
sdd = "sdd.cli:main"

[tool.setuptools.packages.find]
include = ["sdd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
